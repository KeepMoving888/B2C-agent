# ========== Redis ==========
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: cs-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: cs-platform
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
# ========== PostgreSQL ==========
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: cs-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: cs-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: cs-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cs-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          resources:
            requests: {cpu: "250m", memory: "256Mi"}
            limits: {cpu: "1000m", memory: "1Gi"}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cs-platform
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
# ========== Elasticsearch ==========
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: cs-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          ports:
            - containerPort: 9200
          resources:
            requests: {cpu: "500m", memory: "1Gi"}
            limits: {cpu: "1000m", memory: "2Gi"}
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: cs-platform
spec:
  selector:
    app: elasticsearch
  ports:
    - port: 9200
      targetPort: 9200
