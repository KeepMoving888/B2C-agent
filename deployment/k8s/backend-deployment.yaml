apiVersion: apps/v1
kind: Deployment
metadata:
  name: cs-backend
  namespace: cs-platform
  labels:
    app: cs-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cs-backend
  template:
    metadata:
      labels:
        app: cs-backend
    spec:
      containers:
        - name: backend
          image: cs-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: cs-config
            - secretRef:
                name: cs-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cs-backend
  namespace: cs-platform
spec:
  selector:
    app: cs-backend
  ports:
    - port: 8000
      targetPort: 8000
